<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:dark;--ink:#eae4ef;--muted:#a29aac;--pink:#eab8c9;--mint:#a9c9b9}*{box-sizing:border-box}body{margin:0;background:#201e29;color:var(--ink);font-family:var(--vscode-font-family,ui-sans-serif,system-ui,sans-serif);font-size:12px}button{font:inherit;color:inherit;cursor:pointer;border:1px solid #ffffff19;background:#ffffff07;border-radius:7px;padding:6px 11px}button:hover{background:#ffffff14;border-color:#d4bcc452}button:focus-visible{outline:2px solid var(--pink);outline-offset:3px}header{height:48px;padding:0 22px;display:flex;align-items:center;justify-content:flex-end;border-bottom:1px solid #ffffff08;gap:14px}.brand{display:flex;gap:9px;align-items:center;white-space:nowrap}.brand strong{font-size:14px;letter-spacing:.3px;font-weight:600}.brand-moon{font-size:24px;color:#e9e3be}.subtitle{color:var(--muted);font-size:11px;margin-left:8px}nav{display:flex;gap:7px}main{height:calc(100vh - 78px);min-height:205px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,#39324355,transparent 75%)}.sky-speck{position:absolute;color:#ae98b154;font-size:18px;pointer-events:none}.s1{left:15%;top:25%}.s2{left:76%;top:14%;font-size:10px}.s3{left:89%;top:48%;font-size:13px}.ground{height:30px;position:absolute;bottom:0;left:0;right:0;border-top:3px solid #768c76;background:repeating-linear-gradient(90deg,transparent 0 37px,#83978014 38px 42px,transparent 43px 79px),#303c35;box-shadow:0 -4px 0 #51665144}.tuft{position:absolute;top:-16px;color:#d6a9ba;font-size:15px}.t1{left:7%}.t2{left:38%;font-size:11px;color:#d4c69b}.t3{left:72%}.t4{left:93%;color:#b6bed5}footer{height:30px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 22px;color:var(--muted);font-size:10px}footer>span:first-child{display:flex;align-items:center;gap:7px}footer i{width:5px;height:5px;background:var(--mint);border-radius:50%}#empty{position:absolute;inset:22px 0 35px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}.eyebrow{font-size:9px;letter-spacing:2px;color:#b8a4b8}h1{font-size:21px;font-weight:500;margin:13px 0 0}#empty p{color:var(--muted);font-size:12px;margin:10px 0 15px}#empty button{background:#d9b3c318;color:#eccdd9;font-size:11px;padding:7px 16px}#empty button span{margin-left:12px}#pets{position:absolute;inset:0 0 30px;overflow:hidden}.pet{position:absolute;bottom:0;width:170px;display:flex;flex-direction:column;align-items:center;will-change:transform}.pet canvas{width:80px;height:88px;image-rendering:pixelated;cursor:pointer}.bubble{max-width:168px;min-height:32px;padding:8px 11px;border-radius:10px;background:#3b3548;border:1px solid #6b5a754d;color:#e9deed;font-size:11px;line-height:1.4;text-align:center;position:relative;margin-bottom:7px;box-shadow:0 4px 10px #00000012}.bubble:after{content:'';position:absolute;bottom:-5px;left:calc(50% - 4px);width:7px;height:7px;transform:rotate(45deg);background:inherit;border-right:1px solid #6b5a754d;border-bottom:1px solid #6b5a754d}.pet.waiting .bubble{background:#e6bbcc;color:#3f2c3b;border-color:#f7d9e5;animation:attention 2.4s ease-in-out infinite}.name{font-size:9px;letter-spacing:.6px;color:#b3a9bc;position:absolute;bottom:1px;background:#24232bba;border-radius:3px;padding:1px 5px}.pet.waiting .name{color:#f1c3d6}.pet.sleeping .bubble{color:#b1a1c2}.pet.done .bubble{color:#b9ddc2}@keyframes attention{50%{box-shadow:0 0 0 4px #e6bbcc12}}@media(max-width:520px){.subtitle,#hint{display:none}header{padding:0 12px}.brand strong{font-size:12px}nav{gap:4px}nav button{padding:5px 7px}footer{padding:0 12px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}

/* Quiet pixel night sky: decoration stays behind interactive content. */
body{background:#101522;--muted:#a1acc5}
header,footer{background:#111725}
main{isolation:isolate;background:radial-gradient(ellipse at 50% 115%,#34335488,transparent 65%),linear-gradient(180deg,#10172a 0%,#1b2340 70%,#252940 100%)}
.night-sky{position:absolute;inset:0;z-index:-1;pointer-events:none;background:url('../media/stars.svg') repeat;opacity:.95}
.moon{position:absolute;right:9%;top:24px;width:28px;height:32px;background:#e9e3be;clip-path:polygon(35% 0,70% 0,70% 10%,48% 10%,48% 22%,35% 22%,35% 65%,48% 65%,48% 78%,70% 78%,70% 87%,88% 87%,88% 94%,70% 94%,70% 100%,35% 100%,35% 90%,16% 90%,16% 74%,6% 74%,6% 26%,16% 26%,16% 10%,35% 10%)}
.sky-speck{color:#d0d7f3;font-size:12px;animation:starlight 6s ease-in-out infinite}
.s1{left:12%;top:18%}.s2{left:68%;top:23%;font-size:9px;animation-delay:-2s}.s3{left:85%;top:59%;font-size:10px;animation-delay:-4s}
.ground{border-top-color:#6a7993;background:repeating-linear-gradient(90deg,transparent 0 37px,#8190b012 38px 42px,transparent 43px 79px),#202b3a;box-shadow:0 -4px 0 #52668733}
.tuft{color:#a5a7c9}.t2{color:#aaa98e}.t4{color:#8ba9c5}
.bubble{background:#2b334c;border-color:#7784ad55}.name{background:#111725d9;color:#c1c8dd}
#empty{background:radial-gradient(ellipse at center,#182036cc 0%,transparent 70%)}
#pets{pointer-events:none}.pet{pointer-events:auto}
@keyframes starlight{0%,100%{opacity:.4}50%{opacity:.9}}
@media(prefers-reduced-motion:reduce){.sky-speck{animation:none}}

/* Keep multiple agents readable; scroll horizontally when the panel is full. */
#pets{overflow-x:auto;overflow-y:hidden;pointer-events:auto;scrollbar-width:thin;scrollbar-color:#536281 transparent}
#pets:empty{pointer-events:none}

.name{max-width:165px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Project and task are separate lines so agents can be distinguished. */
.pet canvas{margin-bottom:18px}
.name{white-space:pre-line;text-align:center;line-height:13px;max-height:28px}

.pet.observed .name{border-left:2px solid #8aafd1}
@media(max-width:400px){nav button{font-size:10px;padding:5px}}

/* Each label has its own line; long project names cannot hide the task. */
.name{width:165px;white-space:normal;max-height:none}
.agent-title,.agent-task{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent-task{color:#aebbd6;font-size:9px}

.pet canvas:focus-visible{outline:2px solid #a6cbbc;outline-offset:2px;border-radius:5px}

header{overflow-x:auto;flex-shrink:0}nav{flex-shrink:0;white-space:nowrap}
</style><title>Agent Meadow</title></head>
<body>
  <header><nav aria-label="에이전트 연결"><button data-command="connectExisting">기존 대화 연결</button><button data-command="codex">＋ Codex</button><button data-command="claude">＋ Claude</button><button data-command="character">캐릭터 변경</button></nav></header>
  <main id="garden" aria-label="에이전트 정원">
    <div class="night-sky" aria-hidden="true"><div class="moon"></div><span class="sky-speck s1">✦</span><span class="sky-speck s2">✦</span><span class="sky-speck s3">✦</span></div>
    <div id="empty"><span class="eyebrow">A LITTLE COMPANY WHILE YOU CODE</span><h1>함께 일하고, 함께 쉬어요.</h1><p>Codex 토끼와 Claude 고양이를 정원에 초대해 보세요.</p></div>
    <div id="pets"></div><div class="ground"><span class="tuft t1">✿</span><span class="tuft t2">✿</span><span class="tuft t3">✿</span><span class="tuft t4">✿</span></div>
  </main>
  <footer><span><i></i><span id="count">아직 연결된 동료가 없어요</span></span><span id="hint">말풍선을 누르면 작업으로 돌아가요</span></footer>
  <script>/* Hand-drawn pixel sprites; no network assets or image dependencies. */
(() => {
  const api=typeof acquireVsCodeApi==='function'?acquireVsCodeApi():{postMessage:()=>{}};
  const root=document.getElementById('pets'), models=new Map();
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let visible=true,last=0;
  document.addEventListener('visibilitychange',()=>{visible=!document.hidden;});
  document.querySelectorAll('[data-command]').forEach(b=>b.addEventListener('click',()=>api.postMessage({type:'command',command:b.dataset.command})));
  function draw(canvas, provider, state, time, character) {
    const c=canvas.getContext('2d'); c.clearRect(0,0,40,44);c.imageSmoothingEnabled=false;
    const frame=reduced?0:Math.floor(time/240)%2;
    const rabbit=(character|| (provider==='codex'?'rabbit':'cat'))==='rabbit', asleep=state==='sleeping', walk=state==='idle';
    const fur=rabbit?'#f5e7e7':'#edc4a0',shade=rabbit?'#d7bbc9':'#c9987d',edge='#655366',pink='#e99eae';
    const rect=(x,y,w,h,color)=>{c.fillStyle=color;c.fillRect(x,y,w,h);};
    rect(9,39,23,2,'#11121a44');
    c.save();c.translate(0,(walk||state==='working')?frame:state==='done'?-frame*3:0);
    if(character==='penguin'){
      const ink='#39465e', blue='#617898', cream='#f4ecdf', beak='#efb477';
      if(asleep){
        rect(8,29,25,9,ink);rect(11,26,18,12,blue);rect(12,30,15,8,cream);
        rect(27,33,7,3,beak);rect(9,35,6,3,blue);rect(20,32,4,1,ink);
        rect(10,38,6,2,beak);rect(5,35,4,2,blue);
        c.fillStyle='#cbb9db';c.font='7px monospace';c.fillText('z',28,23-frame);c.fillText('Z',33,16-frame);
      }else{
        rect(12,10,16,3,ink);rect(9,13,22,23,ink);rect(11,12,18,25,blue);
        rect(14,9,5,3,blue);rect(18,7,3,4,blue);
        rect(12,17,7,9,cream);rect(22,17,6,9,cream);rect(14,24,13,13,cream);rect(12,29,16,6,cream);
        const blink=Math.floor(time/160)%31===0;
        rect(15,21,2,blink?1:3,ink);rect(24,21,2,blink?1:3,ink);
        rect(18,25,6,2,beak);rect(20,27,2,1,beak);
        rect(12,25,3,2,pink);rect(26,25,3,2,pink);
        rect(11,37,7,3,beak);rect(23,37+(walk?frame:0),7,3,beak);
        rect(10,29,20,2,'#a6cbbc');rect(24,30,3,5,'#a6cbbc');
        rect(6,27+(walk?frame:0),5,8,blue);
        rect(30,state==='waiting'?21-frame*2:27,5,8,blue);
        if(state==='working'){rect(9,32,23,6,'#6e7c90');rect(11,33,19,4,'#b9c5cf');rect(8,38,25,2,'#8d99ad');rect(19,34,3,2,cream);}
        if(state==='waiting'){rect(35,9,2,6,pink);rect(35,17,2,2,pink);}
        if(state==='thinking')for(let i=0;i<3;i++)rect(14+i*5,2,2,2,i===Math.floor(time/350)%3?cream:'#87758e');
        if(state==='done'){rect(30,4,2,2,pink);rect(34,4,2,2,pink);rect(29,6,8,2,pink);rect(31,8,4,2,pink);rect(32,10,2,1,pink);}
      }
      c.restore();return;
    }
    if(asleep){
      rect(8,29,25,9,edge);rect(9,27,21,10,fur);rect(7,30,7,6,fur);rect(27,31,7,6,fur);
      if(rabbit){rect(11,23,12,3,shade);rect(13,26,12,3,fur);}else{rect(11,25,4,6,fur);rect(22,25,4,6,fur);}
      rect(13,32,4,1,edge);rect(21,32,4,1,edge);rect(17,35,3,1,pink);
      c.fillStyle='#cbb9db';c.font='7px monospace';c.fillText('z',29,21-frame*2);c.fillText('Z',33,14-frame*2);
    }else{
      // Ears.
      if(rabbit){rect(10,4,6,16,edge);rect(11,3,4,16,fur);rect(12,6,2,9,pink);rect(24,4,6,16,edge);rect(25,3,4,16,fur);rect(26,6,2,9,pink);}
      else{rect(8,12,7,10,edge);rect(9,10,3,11,fur);rect(10,14,3,5,pink);rect(25,12,7,10,edge);rect(28,10,3,11,fur);rect(27,14,3,5,pink);rect(31,31,5,3,shade);rect(34,27,3,6,fur);}
      // Body, face, cheeks and tiny feet.
      rect(11,27,18,11,edge);rect(12,27,16,11,fur);rect(15,29,10,7,rabbit?'#c3d4bf':'#c0b9db');
      rect(8,18,24,12,edge);rect(10,16,20,16,edge);rect(9,19,22,10,fur);rect(11,17,18,14,fur);
      const blink=Math.floor(time/160)%31===0;
      rect(13,22,2,blink?1:3,edge);rect(25,22,2,blink?1:3,edge);
      rect(10,26,4,2,pink);rect(27,26,3,2,pink);rect(19,26,2,1,edge);rect(18,28,4,1,pink);
      rect(12,37,6,2,shade);rect(23,37+(walk?frame:0),6,2,shade);
      if(state==='working') {rect(9,31,22,7,'#6e7c90');rect(11,32,18,4,'#b9c5cf');rect(8,38,25,2,'#8d99ad');rect(18,33,4,2,'#eee0cd');}
      else if(state==='waiting'){rect(29,25-frame*2,4,6,fur);rect(30,24-frame*2,3,2,shade);rect(34,7,2,6,'#f0c4d3');rect(34,15,2,2,'#f0c4d3');}
      else{rect(9,31,4,4,fur);rect(28,31,3,4,fur);}
      if(state==='thinking'){for(let i=0;i<3;i++)rect(15+i*5,0,2,2,i===Math.floor(time/350)%3?'#ead5e5':'#87758e');}
      if(state==='done'){rect(31,3,2,2,pink);rect(35,3,2,2,pink);rect(30,5,8,2,pink);rect(32,7,4,2,pink);rect(33,9,2,1,pink);}
    }
    c.restore();
  }
  function sync(pets){
    const ids=new Set(pets.map(p=>p.id));
    for(const [id,m] of models)if(!ids.has(id)){m.el.remove();models.delete(id);}
    for(const [i,p] of pets.entries()){
      let m=models.get(p.id);
      if(!m){
        const el=document.createElement('div'), bubble=document.createElement('button'), canvas=document.createElement('canvas'), name=document.createElement('span');
        bubble.className='bubble';canvas.width=40;canvas.height=44;canvas.tabIndex=0;canvas.setAttribute('role','button');canvas.setAttribute('aria-label','캐릭터 변경');canvas.title='클릭해서 캐릭터 변경';name.className='name';el.append(bubble,canvas,name);root.append(el);
        const inspect=()=>{api.postMessage({type:'inspect',id:p.id});};bubble.addEventListener('click',inspect);
        const change=()=>api.postMessage({type:'character',id:p.id});canvas.addEventListener('click',change);canvas.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();change();}});
        m={el,bubble,canvas,name,x:(i+.5)*root.clientWidth/Math.max(pets.length,1)-85,direction:i%2?1:-1,data:p};models.set(p.id,m);
      }
      m.index=i;m.data=p;m.el.className='pet '+p.state+(p.observed?' observed':'');m.bubble.textContent=p.message;const title=document.createElement('span'), task=document.createElement('span');title.className='agent-title';task.className='agent-task';title.textContent=p.name;task.textContent=p.task||'';m.name.replaceChildren(title,task);m.name.title=p.name+(p.task?' · '+p.task:'');
      m.bubble.setAttribute('aria-label',p.name+': '+p.message+' · 작업 확인');
    }
    document.getElementById('empty').style.display=pets.length?'none':'flex';
    const waiting=pets.filter(p=>p.state==='waiting').length;
    document.getElementById('count').textContent=pets.length?`${pets.length}명의 작은 동료${waiting?' · '+waiting+'명이 확인을 기다려요':''}`:'아직 연결된 동료가 없어요';
  }
  function frame(t){
    const dt=Math.min((t-last)/1000,.1);last=t;
    if(visible)for(const m of models.values()){
      const lane=Math.max(210,root.clientWidth/Math.max(1,models.size));
      const min=m.index*lane+15, max=(m.index+1)*lane-185;
      if(m.data.state==='idle'&&!reduced){m.x+=m.direction*dt*12;if(m.x<=min||m.x>=max)m.direction*=-1;}
      m.x=Math.max(min,Math.min(max,m.x));m.el.style.transform=`translateX(${m.x}px)`;
      draw(m.canvas,m.data.provider,m.data.state,t,m.data.character);
    }
    requestAnimationFrame(frame);
  }
  window.addEventListener('message',e=>{if(e.data?.type==='state'&&Array.isArray(e.data.pets))sync(e.data.pets);});
  api.postMessage({type:'ready'});requestAnimationFrame(frame);
})();
</script>
</body></html>
