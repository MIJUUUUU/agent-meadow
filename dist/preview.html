/* Quiet pixel night sky: decoration stays behind interactive content. */
body{background:#101522;--muted:#a1acc5}
header,footer{background:#111725}
main{isolation:isolate;background:radial-gradient(ellipse at 50% 115%,#34335488,transparent 65%),linear-gradient(180deg,#10172a 0%,#1b2340 70%,#252940 100%)}
.night-sky{position:absolute;inset:0;z-index:-1;pointer-events:none;background:url('../media/stars.svg') repeat;opacity:.95}
.moon{position:absolute;right:9%;top:24px;width:28px;height:32px;background:#e9e3be;clip-path:polygon(35% 0,70% 0,70% 10%,48% 10%,48% 22%,35% 22%,35% 65%,48% 65%,48% 78%,70% 78%,70% 87%,88% 87%,88% 94%,70% 94%,70% 100%,35% 100%,35% 90%,16% 90%,16% 74%,6% 74%,6% 26%,16% 26%,16% 10%,35% 10%)}
.sky-speck{color:#d0d7f3;font-size:12px;animation:starlight 6s ease-in-out infinite}
.s1{left:12%;top:18%}.s2{left:68%;top:23%;font-size:9px;animation-delay:-2s}.s3{left:85%;top:59%;font-size:10px;animation-delay:-4s}
.ground{border-top-color:#6a7993;background:repeating-linear-gradient(90deg,transparent 0 37px,#8190b012 38px 42px,transparent 43px 79px),#202b3a;box-shadow:0 -4px 0 #52668733}
.tuft{color:#a5a7c9}.t2{color:#aaa98e}.t4{color:#8ba9c5}
.bubble{background:#2b334c;border-color:#7784ad55}.name{background:#111725d9;color:#c1c8dd}
#empty{background:radial-gradient(ellipse at center,#182036cc 0%,transparent 70%)}
#pets{pointer-events:none}.pet{pointer-events:auto}
@keyframes starlight{0%,100%{opacity:.4}50%{opacity:.9}}
@media(prefers-reduced-motion:reduce){.sky-speck{animation:none}}

/* All agents share the visible garden; no horizontal scrolling. */
#pets{overflow:hidden;pointer-events:auto}
#pets:empty{pointer-events:none}

.name{max-width:165px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Project and task are separate lines so agents can be distinguished. */
.pet canvas{margin-bottom:18px}
.name{white-space:pre-line;text-align:center;line-height:13px;max-height:28px}

.pet.observed .name{border-left:2px solid #8aafd1}
@media(max-width:400px){nav button{font-size:10px;padding:5px}}

/* Each label has its own line; long project names cannot hide the task. */
.name{width:165px;white-space:normal;max-height:none}
.agent-title,.agent-task{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent-task{color:#aebbd6;font-size:9px}

.pet canvas:focus-visible{outline:2px solid #a6cbbc;outline-offset:2px;border-radius:5px}

header{overflow-x:auto;flex-shrink:0}nav{flex-shrink:0;white-space:nowrap}

/* Smaller companions share the same walking area and may pass one another. */
.pet{width:136px;pointer-events:none}
.pet canvas{width:64px;height:70.4px;pointer-events:auto}
.pet .bubble{max-width:132px;font-size:10px;padding:6px 8px;pointer-events:auto}
.pet .name{width:132px;max-width:100%;font-size:8px;letter-spacing:.2px;pointer-events:auto}
.pet:hover,.pet:focus-within{z-index:20}

      }
      m.index=i;m.data=p;m.el.className='pet '+p.state+(p.observed?' observed':'');m.bubble.textContent=p.message;const title=document.createElement('span'), task=document.createElement('span');title.className='agent-title';task.className='agent-task';title.textContent=p.name;task.textContent=p.task||'';m.name.replaceChildren(title,task);m.name.title=p.name+(p.task?' · '+p.task:'');
      m.bubble.setAttribute('aria-label',p.name+': '+p.message+' · 작업 확인');
    }
    document.getElementById('empty').style.display=pets.length?'none':'flex';
    const waiting=pets.filter(p=>p.state==='waiting').length;
    document.getElementById('count').textContent=pets.length?`${pets.length}명의 작은 동료${waiting?' · '+waiting+'명이 확인을 기다려요':''}`:'아직 연결된 동료가 없어요';
    if(changed)spread();
  }
  function frame(t){
    const dt=Math.min((t-last)/1000,.1);last=t;
    if(root.clientWidth!==layoutWidth)spread();
    if(visible)for(const m of models.values()){
      const max=Math.max(0,root.clientWidth-Math.min(136,root.clientWidth));
      const roaming=['idle','done'].includes(m.data.state);
      if(roaming&&!reduced&&!m.el.matches(':hover, :focus-within')&&max>0){
        if(m.pause>0){
          m.pause=Math.max(0,m.pause-dt);m.velocity=0;
          if(m.pause===0){
            // Pick a fresh destination, including short strolls and mid-garden turns.
            const travel=Math.min(max,30+Math.random()*160);
            let direction=Math.random()<.5?-1:1;
            if(m.x<12)direction=1;else if(m.x>max-12)direction=-1;
            m.target=Math.max(0,Math.min(max,m.x+direction*travel));
            m.speed=12+Math.random()*14;
          }
        }else{
          const distance=m.target-m.x;
          if(Math.abs(distance)<1.2){m.velocity=0;m.pause=.8+Math.random()*3.2;}
          else{
            // Slow down before arriving; accelerate gently when starting again.
            const desired=Math.sign(distance)*Math.min(m.speed,Math.abs(distance)*2);
            m.velocity+=(desired-m.velocity)*(1-Math.exp(-5*dt));
            const step=m.velocity*dt;
            m.x+=Math.abs(step)>Math.abs(distance)?distance:step;
            if(Math.abs(m.velocity)>1)m.direction=Math.sign(m.velocity);
          }
        }
      }else{
        m.velocity=0;
      }
      m.x=Math.max(0,Math.min(max,m.x));m.el.style.transform=`translateX(${m.x}px)`;
      m.canvas.style.transform=roaming&&m.direction<0?'scaleX(-1)':'none';
      draw(m.canvas,m.data.provider,m.data.state,t+m.phase,m.data.character,Math.abs(m.velocity)>1);
    }
    requestAnimationFrame(frame);
  }
  window.addEventListener('message',e=>{if(e.data?.type==='state'&&Array.isArray(e.data.pets))sync(e.data.pets);});
  api.postMessage({type:'ready'});requestAnimationFrame(frame);
})();
</script>
